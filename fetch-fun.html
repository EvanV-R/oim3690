
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fetch Something Fun</title>
  <style>
    body {
      font: 16px system-ui;
      max-width: 650px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      background: white;
      padding: 28px;
      border-radius: 14px;
    }
    button {
      font: inherit;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #165dba;
      color: white;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      min-height: 2em;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Fetch Something Fun</h1>
    <p>Get a random trivia question from Open Trivia DB!</p>

    <button id="load">Get a trivia question</button>

    <p id="result" role="status" aria-live="polite">
      Click the button to begin.
    </p>
  </main>

  <script>
    const button = document.querySelector("#load");
    const result = document.querySelector("#result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "Loading trivia question...";

      try {
        const response = await fetch(
          "https://opentdb.com/api.php?amount=1&type=boolean"
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (data.response_code !== 0 || !data.results?.length) {
          throw new Error("No trivia question available");
        }

        const trivia = data.results[0];

        const decodeHTML = (text) => {
          const element = document.createElement("textarea");
          element.innerHTML = text;
          return element.value;
        };

        result.textContent =
          `Question: ${decodeHTML(trivia.question)}\n` +
          `Correct answer: ${trivia.correct_answer}`;

        result.style.whiteSpace = "pre-line";

      } catch (error) {
        result.textContent =
          `Could not load trivia: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
