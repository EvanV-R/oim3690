<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetch Something Fun</title><style>body{font:16px system-ui;max-width:650px;margin:60px auto;padding:20px;background:#f5f7fb;color:#172033}main{background:white;padding:28px;border-radius:14px}button{font:inherit;padding:12px 20px;border:0;border-radius:8px;background:#165dba;color:white;cursor:pointer}#result{margin-top:20px;min-height:2em}</style></head><body><main><h1>Fetch Something Fun</h1><p>Get a random activity idea from the Bored API.</p><button id="load">Find an activity</button><p id="result" role="status" aria-live="polite">Click the button to begin.</p></main><script>
const button=document.querySelector('#load');const result=document.querySelector('#result');button.addEventListener('click',async()=>{button.disabled=true;result.textContent='Loading...';try{const response=await fetch('https://bored-api.appbrewery.com/random');if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(typeof data.activity!=='string')throw new Error('Missing activity field');result.textContent=`Activity: ${data.activity}`;}catch(error){result.textContent=`Could not load an activity: ${error.message}`;}finally{button.disabled=false;}});
</script></body></html>
