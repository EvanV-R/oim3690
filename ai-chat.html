<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask AI</title><style>body{font:16px system-ui;max-width:700px;margin:60px auto;padding:20px;background:#f5f7fb;color:#172033}main{background:white;padding:28px;border-radius:14px}textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin-top:10px}button{background:#165dba;color:white;border:0;border-radius:8px;cursor:pointer}#answer{white-space:pre-wrap;line-height:1.5}#status{color:#5b6472}</style></head><body><main><h1>Ask AI</h1><p>Ask a question through a server-side function. The API key stays on the server.</p><label for="question">Your question</label><textarea id="question" rows="4" placeholder="What is an API?"></textarea><button id="ask">Ask AI</button><p id="status" role="status" aria-live="polite"></p><div id="answer" aria-live="polite"></div></main><script>
const ask=document.querySelector('#ask');const status=document.querySelector('#status');const answer=document.querySelector('#answer');ask.addEventListener('click',async()=>{const question=document.querySelector('#question').value.trim();if(!question){status.textContent='Enter a question first.';return;}ask.disabled=true;status.textContent='Thinking...';answer.textContent='';try{const response=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);answer.textContent=data.answer||'No answer returned.';status.textContent='Answer received.';}catch(error){status.textContent=`Request failed: ${error.message}`;}finally{ask.disabled=false;}});
</script></body></html>
